<h2>Product Create</h2>
<form #productForm="ngForm" (ngSubmit)="handleSubmit(productForm)">
  <div class="mb-3">
    <label for="title" class="form-label">Product Title</label>
    <input
      type="title"
      class="form-control"
      id="title"
      name="title"
      #title="ngModel"
      required
      minlength="3"
      [(ngModel)]="products.title"
      [ngClass]="{ 'is-invalid': title.invalid && title.touched }"
    />
    <div *ngIf="title.invalid && title.touched" class="invalid-feedback">
      <div *ngIf="title.errors?.['required']">Name is required.</div>
      <div *ngIf="title.errors?.['minlength']">
        Name must be at least 3 characters long.
      </div>
    </div>
  </div>

  <div class="mb-3">
    <label for="image" class="form-label">Product Image</label>
    <input
      type="text"
      class="form-control"
      id="image"
      name="image"
      required
      #image="ngModel"
      [(ngModel)]="products.image"
      [ngClass]="{ 'is-invalid': title.invalid && title.touched }"
    />
    <div *ngIf="image.invalid && image.touched" class="invalid-feedback">
      <div *ngIf="image.errors?.['required']">Name is required.</div>
    </div>
  </div>

  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Product Price</label>
    <input
      type="number"
      class="form-control"
      id="price"
      name="price"
      required
      #price="ngModel"
      [(ngModel)]="products.price"
      [ngClass]="{ 'is-invalid': price.invalid && price.touched }"
    />
    <div *ngIf="price.invalid && price.touched" class="invalid-feedback">
      <div *ngIf="image.errors?.['required']">Name is required.</div>
    </div>
  </div>

  <button
    type="submit"
    class="btn btn-primary"
    [disabled]="productForm.invalid"
  >
    Submit
  </button>
</form>
