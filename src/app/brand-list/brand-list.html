<h2 class="text-center m-4">Brand List</h2>
<div *ngIf="brands.length > 0; else noProducts">
  <table class="table">
    <thead>
      <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let b of brands">
        <td>{{ b.id }}</td>
        <td>{{ b.name }}</td>
        <td>
          <button class="btn btn-warning">Sửa</button>
          <button class="btn btn-danger">Xóa</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<ng-template #noProducts>
  <p>No products match the filter.</p>
</ng-template>
